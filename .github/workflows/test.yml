name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Node the skills promise, and the current LTS.
        node: [18, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: README and SKILL.md pass the 5th-grade-reading check
        run: node skills/5th-grade-reading/scripts/readability.mjs --check README.md skills/*/SKILL.md
